services:
  mysql:
    image: mysql:8.0
    container_name: chegowia-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-chegowia}
      MYSQL_USER: ${MYSQL_USER:-chegowia}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-chegowia}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - chegowia_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: chegowia-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      - mysql

volumes:
  chegowia_mysql_data:
